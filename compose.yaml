# Local stack: apollo built from source in front of Navidrome.
#
#   docker compose up --build
#
# apollo: http://localhost:8080   Navidrome UI: http://localhost:4533
# Music is read from ./music unless NAVIDROME_MUSIC_DIR is set.
services:
  apollo:
    build:
      context: .
      args:
        VERSION: dev
    ports:
      - "8080:8080"
    environment:
      APOLLO_NAVIDROME_URL: http://navidrome:4533
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    depends_on:
      - navidrome

  navidrome:
    image: deluan/navidrome:0.64.2
    ports:
      - "4533:4533"
    volumes:
      - navidrome-data:/data
      - ${NAVIDROME_MUSIC_DIR:-./music}:/music:ro

volumes:
  navidrome-data:
