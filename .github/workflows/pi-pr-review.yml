name: Pi PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pi-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and fork PRs (forks don't get secrets and shouldn't run with them)
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'text<<PROMPT_EOF'
            yq -r '.prompt' .github/prompts/pr-review.yml
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: shaftoe/pi-coding-agent-action@v2.30.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: opencode-go
          model: kimi-k3.1-pro
          thinking_level: low
          token: ${{ secrets.OPENCODE_API_KEY }}
          update_comment: true
          prompt: ${{ steps.prompt.outputs.text }}
